name: Draft release
on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  draft-release:
    name: Create draft release for the pushed tag
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }} 🌈" \
            --verify-tag \
            --generate-notes \
            --draft
